<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetpack Joyride</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 700px;
            overflow: hidden;
            background: #87CEEB;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(180deg, #FFD700 0%, #FF6B00 50%, #FF0066 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(255, 107, 0, 0.5);
            letter-spacing: 4px;
            margin-bottom: 10px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 18px;
            color: #FFD700;
            letter-spacing: 8px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .btn {
            background: linear-gradient(135deg, #FF6B00, #FF0066);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 22px;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 8px 30px rgba(255, 0, 102, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(255, 0, 102, 0.7), inset 0 -4px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            opacity: 0.8;
            font-size: 14px;
            line-height: 1.8;
        }

        .instructions kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: monospace;
            font-weight: bold;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FF8C00);
            border-radius: 50%;
            border: 2px solid #B8860B;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-over-title {
            font-size: 64px;
            font-weight: 900;
            color: #FF0066;
            text-shadow: 0 4px 20px rgba(255, 0, 102, 0.5);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 900;
            color: #FFD700;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }

        .flash.active {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="game"></canvas>

    <div class="hud" id="hud" style="display: none;">
        <div class="hud-item">
            <div class="coin-icon"></div>
            <span id="coins">0</span>
        </div>
        <div class="hud-item">
            <span id="distance">0m</span>
        </div>
    </div>

    <div class="flash" id="flash"></div>

    <div class="overlay" id="startScreen">
        <div class="title">JETPACK</div>
        <div class="subtitle">JOYRIDE</div>
        <button class="btn" onclick="startGame()">JOUER</button>
        <div class="instructions">
            <div><kbd>ESPACE</kbd> ou <kbd>CLIC</kbd> pour voler</div>
            <div>Évite les obstacles et collecte les pièces !</div>
        </div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
        <div class="game-over-title">CRASH !</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Distance</div>
                <div class="stat-value" id="finalDistance">0m</div>
            </div>
            <div class="stat">
                <div class="stat-label">Pièces</div>
                <div class="stat-value" id="finalCoins">0</div>
            </div>
        </div>
        <div class="stat" style="margin-bottom: 30px;">
            <div class="stat-label">Meilleur</div>
            <div class="stat-value" id="bestDistance">0m</div>
        </div>
        <button class="btn" onclick="restartGame()">REJOUER</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Taille logique
    const W = 1200;
    const H = 700;
    canvas.width = W;
    canvas.height = H;

    // État du jeu
    let gameState = 'menu'; // menu, playing, gameover
    let frame = 0;
    let distance = 0;
    let coins = 0;
    let bestDistance = parseInt(localStorage.getItem('jetpackBest') || '0');
    let scrollSpeed = 5;
    let baseScrollSpeed = 5;

    // Joueur
    const player = {
        x: 200,
        y: H / 2,
        vy: 0,
        width: 50,
        height: 60,
        gravity: 0.6,
        thrust: -1.2,
        maxFallSpeed: 12,
        maxRiseSpeed: -10,
        thrusting: false,
        rotation: 0,
    };

    // Entités
    let obstacles = [];
    let coinList = [];
    let particles = [];
    let clouds = [];
    let groundOffset = 0;
    let bgOffset = 0;

    // Initialiser nuages
    for (let i = 0; i < 8; i++) {
        clouds.push({
            x: Math.random() * W,
            y: Math.random() * (H - 200),
            size: 30 + Math.random() * 60,
            speed: 0.3 + Math.random() * 0.7,
        });
    }

    // Contrôles
    let thrusting = false;

    function handleDown(e) {
        if (e) e.preventDefault();
        thrusting = true;
        if (gameState === 'menu') startGame();
    }

    function handleUp(e) {
        if (e) e.preventDefault();
        thrusting = false;
    }

    document.addEventListener('mousedown', handleDown);
    document.addEventListener('mouseup', handleUp);
    document.addEventListener('touchstart', handleDown, { passive: false });
    document.addEventListener('touchend', handleUp, { passive: false });
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            thrusting = true;
            if (gameState === 'menu') startGame();
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.code === 'Space') thrusting = false;
    });

    // Génération d'obstacles
    let spawnTimer = 0;
    function spawnObstacle() {
        const type = Math.random();

        if (type < 0.4) {
            // Missile
            obstacles.push({
                type: 'missile',
                x: W + 50,
                y: 100 + Math.random() * (H - 250),
                width: 60,
                height: 20,
                speed: scrollSpeed + 3,
            });
        } else if (type < 0.7) {
            // Zapper (barrière verticale)
            const h = 150 + Math.random() * 200;
            const y = 80 + Math.random() * (H - 200 - h);
            obstacles.push({
                type: 'zapper',
                x: W + 50,
                y: y,
                width: 30,
                height: h,
                speed: scrollSpeed,
            });
        } else {
            // Pièces en ligne
            const count = 5 + Math.floor(Math.random() * 6);
            const startY = 100 + Math.random() * (H - 250);
            const pattern = Math.random();
            for (let i = 0; i < count; i++) {
                let cx = W + 50 + i * 40;
                let cy = startY;
                if (pattern < 0.3) cy = startY + Math.sin(i * 0.8) * 40; // vague
                else if (pattern < 0.6) cy = startY - i * 15; // montée
                else cy = startY + i * 10; // descente
                coinList.push({
                    x: cx,
                    y: cy,
                    radius: 12,
                    collected: false,
                    angle: Math.random() * Math.PI * 2,
                });
            }
        }
    }

    // Particules du jetpack
    function emitJetpackParticles() {
        if (!player.thrusting) return;
        for (let i = 0; i < 3; i++) {
            particles.push({
                x: player.x - 5,
                y: player.y + 20 + Math.random() * 10,
                vx: -2 - Math.random() * 3,
                vy: 2 + Math.random() * 3,
                life: 30,
                maxLife: 30,
                size: 4 + Math.random() * 6,
                color: Math.random() < 0.5 ? '#FF6B00' : '#FFD700',
                type: 'fire',
            });
        }
    }

    function emitExplosion(x, y) {
        for (let i = 0; i < 40; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 6;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 40 + Math.random() * 20,
                maxLife: 60,
                size: 3 + Math.random() * 5,
                color: ['#FF0066', '#FF6B00', '#FFD700', '#FFFFFF'][Math.floor(Math.random() * 4)],
                type: 'explosion',
            });
        }
    }

    function emitCoinSparkle(x, y) {
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 20,
                maxLife: 20,
                size: 2 + Math.random() * 3,
                color: '#FFD700',
                type: 'sparkle',
            });
        }
    }

    // Dessin
    function drawBackground() {
        // Ciel dégradé
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#FF9A8B');
        grad.addColorStop(0.3, '#FFB88C');
        grad.addColorStop(0.6, '#FFD89B');
        grad.addColorStop(1, '#87CEEB');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Soleil
        const sunX = W - 150;
        const sunY = 150;
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 120);
        sunGrad.addColorStop(0, 'rgba(255, 255, 200, 1)');
        sunGrad.addColorStop(0.3, 'rgba(255, 220, 100, 0.8)');
        sunGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(sunX - 120, sunY - 120, 240, 240);

        ctx.fillStyle = '#FFF5CC';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
        ctx.fill();

        // Montagnes lointaines (parallaxe)
        ctx.fillStyle = 'rgba(100, 80, 120, 0.4)';
        ctx.beginPath();
        ctx.moveTo(0, H - 100);
        for (let i = 0; i <= 10; i++) {
            const x = (i * 150 - bgOffset * 0.2) % (W + 300) - 150;
            const y = H - 100 - Math.sin(i * 1.3) * 80 - 50;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H - 100);
        ctx.closePath();
        ctx.fill();

        // Montagnes proches
        ctx.fillStyle = 'rgba(70, 50, 90, 0.6)';
        ctx.beginPath();
        ctx.moveTo(0, H - 100);
        for (let i = 0; i <= 12; i++) {
            const x = (i * 120 - bgOffset * 0.4) % (W + 300) - 150;
            const y = H - 100 - Math.sin(i * 2.1 + 1) * 60 - 30;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H - 100);
        ctx.closePath();
        ctx.fill();

        // Nuages
        clouds.forEach(c => {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size * 0.6, 0, Math.PI * 2);
            ctx.arc(c.x + c.size * 0.5, c.y - c.size * 0.2, c.size * 0.5, 0, Math.PI * 2);
            ctx.arc(c.x + c.size, c.y, c.size * 0.55, 0, Math.PI * 2);
            ctx.arc(c.x + c.size * 0.5, c.y + c.size * 0.2, c.size * 0.45, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawGround() {
        // Sol
        const groundY = H - 80;
        const grad = ctx.createLinearGradient(0, groundY, 0, H);
        grad.addColorStop(0, '#4A7C3A');
        grad.addColorStop(0.3, '#3A6B2A');
        grad.addColorStop(1, '#2A4B1A');
        ctx.fillStyle = grad;
        ctx.fillRect(0, groundY, W, 80);

        // Ligne d'herbe
        ctx.fillStyle = '#5A9C4A';
        ctx.fillRect(0, groundY, W, 4);

        // Motifs qui défilent
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        for (let i = 0; i < 30; i++) {
            const x = (i * 50 - groundOffset) % (W + 50);
            ctx.fillRect(x, groundY + 15, 3, 10);
            ctx.fillRect(x + 20, groundY + 30, 2, 8);
        }

        // Bord supérieur du sol (herbe détaillée)
        ctx.fillStyle = '#6AAC5A';
        for (let i = 0; i < 60; i++) {
            const x = (i * 25 - groundOffset) % (W + 25);
            ctx.beginPath();
            ctx.moveTo(x, groundY);
            ctx.lineTo(x + 5, groundY - 8);
            ctx.lineTo(x + 10, groundY);
            ctx.fill();
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Rotation basée sur la vitesse verticale
        const targetRot = Math.max(-0.3, Math.min(0.3, player.vy * 0.03));
        player.rotation += (targetRot - player.rotation) * 0.2;
        ctx.rotate(player.rotation);

        // Jetpack (derrière)
        ctx.fillStyle = '#555';
        ctx.fillRect(-25, -10, 15, 35);
        ctx.fillStyle = '#333';
        ctx.fillRect(-25, -10, 15, 5);
        ctx.fillRect(-25, 20, 15, 5);

        // Flamme du jetpack
        if (player.thrusting) {
            const flameLen = 20 + Math.random() * 15;
            const flameGrad = ctx.createLinearGradient(-18, 25, -18, 25 + flameLen);
            flameGrad.addColorStop(0, '#FFF');
            flameGrad.addColorStop(0.3, '#FFD700');
            flameGrad.addColorStop(0.7, '#FF6B00');
            flameGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(-23, 25);
            ctx.lineTo(-13, 25);
            ctx.lineTo(-18 + (Math.random() - 0.5) * 4, 25 + flameLen);
            ctx.closePath();
            ctx.fill();
        }

        // Corps (combinaison)
        ctx.fillStyle = '#FF6B00';
        ctx.fillRect(-10, -5, 25, 35);

        // Ceinture
        ctx.fillStyle = '#333';
        ctx.fillRect(-10, 15, 25, 4);

        // Jambes
        ctx.fillStyle = '#2255AA';
        ctx.fillRect(-8, 30, 10, 15);
        ctx.fillRect(5, 30, 10, 15);

        // Bottes
        ctx.fillStyle = '#222';
        ctx.fillRect(-10, 42, 12, 5);
        ctx.fillRect(5, 42, 12, 5);

        // Bras
        ctx.fillStyle = '#FF6B00';
        ctx.fillRect(-15, 0, 8, 18);
        ctx.fillRect(12, 0, 8, 18);

        // Gants
        ctx.fillStyle = '#FFF';
        ctx.fillRect(-15, 15, 8, 6);
        ctx.fillRect(12, 15, 8, 6);

        // Casque
        ctx.fillStyle = '#EEE';
        ctx.beginPath();
        ctx.arc(2, -15, 15, 0, Math.PI * 2);
        ctx.fill();

        // Visière
        ctx.fillStyle = '#224488';
        ctx.beginPath();
        ctx.arc(5, -15, 10, -0.5, 1.2);
        ctx.fill();

        // Reflet visière
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(8, -18, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawMissile(m) {
        ctx.save();
        ctx.translate(m.x, m.y);

        // Corps du missile
        const grad = ctx.createLinearGradient(0, -m.height/2, 0, m.height/2);
        grad.addColorStop(0, '#888');
        grad.addColorStop(0.5, '#DDD');
        grad.addColorStop(1, '#666');
        ctx.fillStyle = grad;
        ctx.fillRect(-m.width/2, -m.height/2, m.width, m.height);

        // Pointe
        ctx.fillStyle = '#CC0000';
        ctx.beginPath();
        ctx.moveTo(-m.width/2, -m.height/2);
        ctx.lineTo(-m.width/2 - 15, 0);
        ctx.lineTo(-m.width/2, m.height/2);
        ctx.closePath();
        ctx.fill();

        // Ailettes
        ctx.fillStyle = '#CC0000';
        ctx.beginPath();
        ctx.moveTo(m.width/2 - 10, -m.height/2);
        ctx.lineTo(m.width/2, -m.height/2 - 8);
        ctx.lineTo(m.width/2, -m.height/2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(m.width/2 - 10, m.height/2);
        ctx.lineTo(m.width/2, m.height/2 + 8);
        ctx.lineTo(m.width/2, m.height/2);
        ctx.closePath();
        ctx.fill();

        // Flamme arrière
        const flameLen = 15 + Math.random() * 10;
        const flameGrad = ctx.createLinearGradient(m.width/2, 0, m.width/2 + flameLen, 0);
        flameGrad.addColorStop(0, '#FFF');
        flameGrad.addColorStop(0.4, '#FFD700');
        flameGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.moveTo(m.width/2, -m.height/2 + 3);
        ctx.lineTo(m.width/2 + flameLen, 0);
        ctx.lineTo(m.width/2, m.height/2 - 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawZapper(z) {
        // Pôles
        ctx.fillStyle = '#333';
        ctx.fillRect(z.x - 5, z.y - 15, 10, 15);
        ctx.fillRect(z.x - 5, z.y + z.height, 10, 15);

        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(z.x, z.y - 10, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(z.x, z.y + z.height + 10, 8, 0, Math.PI * 2);
        ctx.fill();

        // Électricité
        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00FFFF';
        ctx.shadowBlur = 15;

        ctx.beginPath();
        let segments = 8;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const y = z.y + t * z.height;
            const x = z.x + (Math.random() - 0.5) * 20;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Deuxième ligne
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const y = z.y + t * z.height;
            const x = z.x + (Math.random() - 0.5) * 15;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    function drawCoin(c) {
        if (c.collected) return;
        ctx.save();
        ctx.translate(c.x, c.y);

        const scaleX = Math.abs(Math.cos(c.angle));
        ctx.scale(scaleX || 0.1, 1);

        // Pièce
        const grad = ctx.createRadialGradient(-3, -3, 0, 0, 0, c.radius);
        grad.addColorStop(0, '#FFF5A0');
        grad.addColorStop(0.5, '#FFD700');
        grad.addColorStop(1, '#B8860B');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fill();

        // Bordure
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Symbole $
        if (scaleX > 0.3) {
            ctx.fillStyle = '#8B6914';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
        }

        ctx.restore();
    }

    function drawParticles() {
        particles.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    // Collisions
    function circleRect(cx, cy, cr, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        return (dx * dx + dy * dy) < (cr * cr);
    }

    function rectRect(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    // Update
    function update() {
        if (gameState !== 'playing') return;

        frame++;

        // Augmentation progressive de la vitesse
        scrollSpeed = baseScrollSpeed + Math.min(5, distance / 2000);

        // Physique joueur
        player.thrusting = thrusting;
        if (thrusting) {
            player.vy += player.thrust;
        } else {
            player.vy += player.gravity;
        }
        player.vy = Math.max(player.maxRiseSpeed, Math.min(player.maxFallSpeed, player.vy));
        player.y += player.vy;

        // Limites
        const groundY = H - 80 - player.height / 2;
        if (player.y > groundY) {
            player.y = groundY;
            player.vy = 0;
        }
        if (player.y < player.height / 2) {
            player.y = player.height / 2;
            player.vy = 0;
        }

        // Distance
        distance += scrollSpeed * 0.1;

        // Défilement
        groundOffset += scrollSpeed;
        bgOffset += scrollSpeed;

        // Nuages
        clouds.forEach(c => {
            c.x -= c.speed + scrollSpeed * 0.3;
            if (c.x + c.size * 2 < 0) {
                c.x = W + c.size;
                c.y = Math.random() * (H - 200);
            }
        });

        // Particules jetpack
        emitJetpackParticles();

        // Mise à jour particules
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.type === 'explosion') p.vy += 0.2;
            p.life--;
        });
        particles = particles.filter(p => p.life > 0);

        // Spawn obstacles
        spawnTimer--;
        if (spawnTimer <= 0) {
            spawnObstacle();
            spawnTimer = 60 + Math.random() * 80 - Math.min(40, distance / 100);
        }

        // Obstacles
        obstacles.forEach(o => {
            o.x -= o.speed;
        });
        obstacles = obstacles.filter(o => o.x + o.width > -50);

        // Pièces
        coinList.forEach(c => {
            c.x -= scrollSpeed;
            c.angle += 0.15;
        });
        coinList = coinList.filter(c => c.x > -50 && !c.collected);

        // Collisions joueur vs obstacles
        const px = player.x - player.width / 2;
        const py = player.y - player.height / 2;
        for (const o of obstacles) {
            if (o.type === 'missile') {
                if (rectRect(px, py, player.width, player.height, o.x - o.width/2, o.y - o.height/2, o.width, o.height)) {
                    gameOver();
                    return;
                }
            } else if (o.type === 'zapper') {
                // Zapper a une hitbox plus fine au centre
                if (rectRect(px + 5, py + 5, player.width - 10, player.height - 10, o.x - 10, o.y, 20, o.height)) {
                    gameOver();
                    return;
                }
            }
        }

        // Collisions joueur vs pièces
        coinList.forEach(c => {
            if (c.collected) return;
            const dx = player.x - c.x;
            const dy = player.y - c.y;
            if (dx * dx + dy * dy < (c.radius + 20) * (c.radius + 20)) {
                c.collected = true;
                coins++;
                emitCoinSparkle(c.x, c.y);
                document.getElementById('coins').textContent = coins;
            }
        });

        // HUD
        document.getElementById('distance').textContent = Math.floor(distance) + 'm';
    }

    // Render
    function render() {
        drawBackground();
        drawGround();

        // Pièces
        coinList.forEach(drawCoin);

        // Obstacles
        obstacles.forEach(o => {
            if (o.type === 'missile') drawMissile(o);
            else if (o.type === 'zapper') drawZapper(o);
        });

        // Particules (derrière le joueur pour le feu, devant pour étincelles)
        drawParticles();

        // Joueur
        if (gameState === 'playing') drawPlayer();
    }

    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        gameState = 'playing';
        distance = 0;
        coins = 0;
        scrollSpeed = baseScrollSpeed;
        player.y = H / 2;
        player.vy = 0;
        obstacles = [];
        coinList = [];
        particles = [];
        spawnTimer = 60;
        frame = 0;

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('coins').textContent = '0';
        document.getElementById('distance').textContent = '0m';
    }

    function gameOver() {
        gameState = 'gameover';
        emitExplosion(player.x, player.y);

        // Flash
        const flash = document.getElementById('flash');
        flash.classList.remove('active');
        void flash.offsetWidth;
        flash.classList.add('active');

        const finalDist = Math.floor(distance);
        if (finalDist > bestDistance) {
            bestDistance = finalDist;
            localStorage.setItem('jetpackBest', bestDistance);
        }

        setTimeout(() => {
            document.getElementById('finalDistance').textContent = finalDist + 'm';
            document.getElementById('finalCoins').textContent = coins;
            document.getElementById('bestDistance').textContent = bestDistance + 'm';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
        }, 800);
    }

    function restartGame() {
        startGame();
    }

    // Lancer la boucle
    gameLoop();
</script>

</body>
